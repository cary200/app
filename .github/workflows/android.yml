name: Build QingPing APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Rule and confirmation checks
        run: |
          mkdir -p /tmp/qp-check
          javac -d /tmp/qp-check app/src/main/java/dev/qingping/app/{Rules,Confirmation}.java checks/RulesCheck.java
          java -cp /tmp/qp-check dev.qingping.app.RulesCheck
      - run: gradle :app:assembleDebug :fixture:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QingPing-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QingPing-test-fixture
          path: fixture/build/outputs/apk/debug/fixture-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: python3 checks/emulator.py

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QingPing-debug
          path: output
      - name: Publish installable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp output/app-debug.apk output/QingPing.apk
          gh release create "qingping-test-${GITHUB_RUN_NUMBER}" output/QingPing.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "清屏个人测试版 ${GITHUB_RUN_NUMBER}" \
            --notes "下载 QingPing.apk 后在安卓手机上安装。首次使用需要手动开启无障碍服务，并选择要保护的应用。当前为调试签名测试包，不同构建之间可能需要卸载旧版后安装，卸载会删除本机统计。"
